server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Vite build output. Every file here is content-hashed (name changes when the
    # content does — js, css, fonts, images, *.geojson, *.pmtiles), so it's safe
    # to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vendored MapLibre glyphs (many small .pbf range files fetched per map load).
    # Not content-hashed, but effectively static — cache a day to avoid a
    # revalidation round-trip per range, while still picking up a rare font swap.
    location /fonts/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # Everything else has a stable URL: the HTML entry points and the non-hashed
    # files served from public/ (locations.json, logos.json, scout-groups.json,
    # app-config.json, logos/, symbols/, …). Always revalidate so a deploy is picked up
    # immediately — nginx's ETag/Last-Modified make this a cheap 304 when
    # unchanged, but it's never served stale.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
